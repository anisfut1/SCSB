<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ball Manager — hors ligne</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #f4f3ef; color: #111; font-family: -apple-system, system-ui, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  main { max-width: 360px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 20px 0 8px; }
  p { color: #555; line-height: 1.5; margin: 0 0 24px; }
  button { font: inherit; font-weight: 600; background: #111; color: #fff; border: 0; border-radius: 12px; padding: 14px 24px; min-height: 48px; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" width="72" height="72">
  <h1>Vous êtes hors ligne</h1>
  <p>Ball Manager a besoin d'une connexion pour afficher vos matchs et vos convocations. Vos informations personnelles ne sont jamais conservées sur l'appareil.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</main>
</body>
</html>
